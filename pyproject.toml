[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fsm-gateway"
version = "1.0.0"
description = "Central FastAPI Gateway for Fahrschulmanager (FSM) API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "redis>=5.0.0",
    "lucide>=1.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
# E402: app/api/router.py importiert bewusst nach dem include_router – die
# un-präfixierten Kompat-Routen sind erst nach der Definition verfügbar.
lint.per-file-ignores = { "app/api/router.py" = ["E402"], "app/main.py" = ["E402"], "app/api/v1/schueler.py" = ["E402"] }
